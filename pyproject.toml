[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-diary"
version = "0.1.0"
description = "ECHO: Egyptian Arabic voice diary with dialect-adaptive speech recognition (DSAI 456)"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
